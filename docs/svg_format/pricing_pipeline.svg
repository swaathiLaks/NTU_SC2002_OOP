<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="430.3125px" preserveAspectRatio="none" style="width:1661px;height:430px;background:#FFFFFF;" version="1.1" viewBox="0 0 1661 430" width="1661.0417px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Arial" font-size="33.6458" font-weight="bold" lengthAdjust="spacing" textLength="710.1042" x="463.0729" y="49.2677">How a price is decided and locked (Stage 3)</text><!--entity A--><g id="elem_A"><rect fill="#F1EAFB" height="157.5938" rx="8.8542" ry="8.8542" style="stroke:#7B58B5;stroke-width:0.8854166666666666;" width="338.2292" x="12.3958" y="100.6686"/><text fill="#2E1F52" font-family="Arial" font-size="21.25" font-weight="bold" lengthAdjust="spacing" textLength="134.5833" x="30.1042" y="138.3092">1. Menu price</text><text fill="#2E1F52" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="270.9375" x="30.1042" y="162.7446">Salad $9.00, Burger $15.00,</text><text fill="#2E1F52" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="263.8542" x="30.1042" y="187.18">Pasta $18.00 (base prices)</text><text fill="#2E1F52" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="302.8125" x="30.1042" y="211.6154">Combo = 90% of its two dishes</text><text fill="#2E1F52" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="278.0208" x="30.1042" y="236.0509">Salad + Pasta: 2700 &#8594; 2430</text></g><!--entity B--><g id="elem_B"><rect fill="#F1EAFB" height="182.0292" rx="8.8542" ry="8.8542" style="stroke:#7B58B5;stroke-width:0.8854166666666666;" width="249.6875" x="497.6042" y="88.2728"/><text fill="#2E1F52" font-family="Arial" font-size="21.25" font-weight="bold" lengthAdjust="spacing" textLength="214.2708" x="515.3125" y="125.9133">2. Customer discount</text><text fill="#2E1F52" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="196.5625" x="515.3125" y="150.3488">Customer.priceFor()</text><text fill="#2E1F52" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="170" x="515.3125" y="174.7842">Regular: full price</text><text fill="#2E1F52" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="198.3333" x="515.3125" y="199.2196">VIP: 90% of the price</text><text fill="#2E1F52" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="141.6667" x="515.3125" y="223.655">Critic: full price</text><text fill="#2E1F52" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="182.3958" x="515.3125" y="248.0905">2430 &#8594; 2187 (VIP)</text></g><!--entity C--><g id="elem_C"><rect fill="#F1EAFB" height="182.0292" rx="8.8542" ry="8.8542" style="stroke:#7B58B5;stroke-width:0.8854166666666666;" width="276.25" x="927.0313" y="88.2728"/><text fill="#2E1F52" font-family="Arial" font-size="21.25" font-weight="bold" lengthAdjust="spacing" textLength="138.125" x="944.7396" y="125.9133">3. Happy Hour</text><text fill="#2E1F52" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="208.9583" x="944.7396" y="150.3488">HappyHour.priceFor()</text><text fill="#2E1F52" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="240.8333" x="944.7396" y="174.7842">80% of the price, but only</text><text fill="#2E1F52" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="214.2708" x="944.7396" y="199.2196">if Happy Hour is active</text><text fill="#2E1F52" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="226.6667" x="944.7396" y="223.655">when the order is taken</text><text fill="#2E1F52" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="131.0417" x="944.7396" y="248.0905">2187 &#8594; 1750</text></g><!--entity D--><g id="elem_D"><rect fill="#F1EAFB" height="157.5938" rx="8.8542" ry="8.8542" style="stroke:#7B58B5;stroke-width:0.8854166666666666;" width="290.4167" x="1360" y="100.6686"/><text fill="#2E1F52" font-family="Arial" font-size="21.25" font-weight="bold" lengthAdjust="spacing" textLength="221.3542" x="1377.7083" y="138.3092">4. Locked in the Order</text><text fill="#2E1F52" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="226.6667" x="1377.7083" y="162.7446">Order.priceCents (final)</text><text fill="#2E1F52" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="255" x="1377.7083" y="187.18">Never changes afterwards</text><text fill="#2E1F52" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="217.8125" x="1377.7083" y="211.6154">Revenue = 1750 cents</text><text fill="#2E1F52" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="168.2292" x="1377.7083" y="236.0509">shown as $17.50</text></g><g id="elem_GMN9"><path d="M462.1875,332.6478 L462.1875,377.446 A8.8542,8.8542 0 0 0 471.0417,386.3002 L773.8542,386.3002 A8.8542,8.8542 0 0 0 782.7083,377.446 L782.7083,341.5019 L765,323.7936 L629.5313,323.7936 L622.4479,271.0405 L615.3646,323.7936 L471.0417,323.7936 A8.8542,8.8542 0 0 0 462.1875,332.6478 " fill="#FFFBE6" style="stroke:#D9C98A;stroke-width:0.8854166666666666;"/><path d="M765,323.7936 L765,337.0748 A4.4271,4.4271 0 0 0 769.4271,341.5019 L782.7083,341.5019 L765,323.7936 " fill="#FFFBE6" style="stroke:#D9C98A;stroke-width:0.8854166666666666;"/><text fill="#000000" font-family="Arial" font-size="19.4792" lengthAdjust="spacing" textLength="283.3333" x="472.8125" y="350.919">Each step rounds to whole cents</text><text fill="#000000" font-family="Arial" font-size="19.4792" lengthAdjust="spacing" textLength="210.7292" x="472.8125" y="373.3181">with Pricing.percentOf().</text></g><g id="elem_GMN12"><path d="M894.2708,332.6478 L894.2708,377.446 A8.8542,8.8542 0 0 0 903.125,386.3002 L1227.1875,386.3002 A8.8542,8.8542 0 0 0 1236.0417,377.446 L1236.0417,341.5019 L1218.3333,323.7936 L1072.2396,323.7936 L1065.1563,271.0405 L1058.0729,323.7936 L903.125,323.7936 A8.8542,8.8542 0 0 0 894.2708,332.6478 " fill="#FFFBE6" style="stroke:#D9C98A;stroke-width:0.8854166666666666;"/><path d="M1218.3333,323.7936 L1218.3333,337.0748 A4.4271,4.4271 0 0 0 1222.7604,341.5019 L1236.0417,341.5019 L1218.3333,323.7936 " fill="#FFFBE6" style="stroke:#D9C98A;stroke-width:0.8854166666666666;"/><text fill="#000000" font-family="Arial" font-size="19.4792" lengthAdjust="spacing" textLength="166.4583" x="904.8958" y="350.919">Order of discounts:</text><text fill="#000000" font-family="Arial" font-size="19.4792" lengthAdjust="spacing" textLength="304.5833" x="904.8958" y="373.3181">customer first, Happy Hour second.</text></g><!--link A to B--><g id="link_A_B"><path d="M351.1385,179.4707 C399.801,179.4707 441.3979,179.4707 486.8021,179.4707 " fill="none" id="A-to-B" style="stroke:#5B6577;stroke-width:1.9479166666666667;"/><polygon fill="#5B6577" points="497.4271,179.4707,481.4896,172.3873,488.5729,179.4707,481.4896,186.554,497.4271,179.4707" style="stroke:#5B6577;stroke-width:1.9479166666666667;"/><text fill="#4A5160" font-family="Arial" font-size="17.7083" lengthAdjust="spacing" textLength="37.1875" x="387.8125" y="174.8309">then</text></g><!--link B to C--><g id="link_B_C"><path d="M747.7167,179.4707 C803.5333,179.4707 859.0313,179.4707 916.3177,179.4707 " fill="none" id="B-to-C" style="stroke:#5B6577;stroke-width:1.9479166666666667;"/><polygon fill="#5B6577" points="926.9427,179.4707,911.0052,172.3873,918.0885,179.4707,911.0052,186.554,926.9427,179.4707" style="stroke:#5B6577;stroke-width:1.9479166666666667;"/><text fill="#4A5160" font-family="Arial" font-size="17.7083" lengthAdjust="spacing" textLength="37.1875" x="819.8958" y="174.8309">then</text></g><!--link C to D--><g id="link_C_D"><path d="M1203.8479,179.4707 C1253.3427,179.4707 1298.7469,179.4707 1348.8438,179.4707 " fill="none" id="C-to-D" style="stroke:#5B6577;stroke-width:1.9479166666666667;"/><polygon fill="#5B6577" point