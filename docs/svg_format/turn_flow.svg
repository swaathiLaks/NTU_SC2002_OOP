<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1664.5833px" preserveAspectRatio="none" style="width:793px;height:1664px;background:#FFFFFF;" version="1.1" viewBox="0 0 793 1664" width="793.3333px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Arial" font-size="33.6458" font-weight="bold" lengthAdjust="spacing" textLength="423.2292" x="182.3958" y="66.9761">One turn in the game loop</text><ellipse cx="354.8307" cy="111.2936" fill="#5B6577" rx="17.7083" ry="17.7083" style="stroke:#222222;stroke-width:1.7708333333333333;"/><rect fill="#E4F4E9" height="108.7229" rx="8.8542" ry="8.8542" style="stroke:#3F9360;stroke-width:0.8854166666666666;" width="481.6667" x="113.9974" y="164.4186"/><text fill="#173D28" font-family="Arial" font-size="21.25" font-weight="bold" lengthAdjust="spacing" textLength="100.9375" x="131.7057" y="202.0592">1. Arrivals</text><text fill="#173D28" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="262.0833" x="131.7057" y="226.4946">GameController.startTurn()</text><text fill="#173D28" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="446.25" x="131.7057" y="250.93">ArrivalSchedule adds a customer to the queue</text><rect fill="#E4F4E9" height="59.8521" rx="8.8542" ry="8.8542" style="stroke:#3F9360;stroke-width:0.8854166666666666;" width="440.9375" x="134.362" y="393.5582"/><text fill="#173D28" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="405.5208" x="152.0703" y="431.1988">Waiting customers recover 15 satisfaction</text><polygon fill="#FFFFFF" points="260.9766,308.5582,448.6849,308.5582,469.9349,329.8082,448.6849,351.0582,260.9766,351.0582,239.7266,329.8082,260.9766,308.5582" style="stroke:#5B6577;stroke-width:0.8854166666666666;"/><text fill="#4A5160" font-family="Arial" font-size="17.7083" lengthAdjust="spacing" textLength="26.5625" x="361.9141" y="367.6684">yes</text><text fill="#173D28" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="187.7083" x="260.9766" y="337.5227">Happy Hour active?</text><polygon fill="#FFFFFF" points="354.8307,488.827,376.0807,510.077,354.8307,531.327,333.5807,510.077,354.8307,488.827" style="stroke:#5B6577;stroke-width:0.8854166666666666;"/><rect fill="#E4F4E9" height="108.7229" rx="8.8542" ry="8.8542" style="stroke:#3F9360;stroke-width:0.8854166666666666;" width="364.7917" x="172.4349" y="566.7436"/><text fill="#173D28" font-family="Arial" font-size="21.25" font-weight="bold" lengthAdjust="spacing" textLength="263.8542" x="190.1432" y="604.3842">Manager's optional choice</text><text fill="#173D28" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="329.375" x="190.1432" y="628.8196">Start Happy Hour (once per game,</text><text fill="#173D28" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="244.375" x="190.1432" y="653.2551">only before any staff acts)</text><rect fill="#E4F4E9" height="59.8521" rx="8.8542" ry="8.8542" style="stroke:#3F9360;stroke-width:0.8854166666666666;" width="426.7708" x="141.4453" y="710.8832"/><text fill="#173D28" font-family="Arial" font-size="21.25" font-weight="bold" lengthAdjust="spacing" textLength="69.0625" x="159.1536" y="748.5238">2. Host</text><text fill="#173D28" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="322.2917" x="228.2161" y="748.5238">: seat a queued customer, or wait</text><rect fill="#E4F4E9" height="84.2875" rx="8.8542" ry="8.8542" style="stroke:#3F9360;stroke-width:0.8854166666666666;" width="474.5833" x="117.5391" y="806.152"/><text fill="#173D28" font-family="Arial" font-size="21.25" font-weight="bold" lengthAdjust="spacing" textLength="90.3125" x="135.2474" y="843.7926">3. Waiter</text><text fill="#173D28" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="348.8542" x="225.5599" y="843.7926">: take an order, serve a READY dish,</text><text fill="#173D28" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="231.9792" x="135.2474" y="868.228">seat a customer, or wait</text><rect fill="#E4F4E9" height="59.8521" rx="8.8542" ry="8.8542" style="stroke:#3F9360;stroke-width:0.8854166666666666;" width="529.4792" x="90.0911" y="925.8562"/><text fill="#173D28" font-family="Arial" font-size="21.25" font-weight="bold" lengthAdjust="spacing" textLength="69.0625" x="107.7995" y="963.4968">3. Chef</text><text fill="#173D28" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="425" x="176.862" y="963.4968">: prepare one unit of the oldest order, or wait</text><rect fill="#E4F4E9" height="108.7229" rx="8.8542" ry="8.8542" style="stroke:#3F9360;stroke-width:0.8854166666666666;" width="423.2292" x="143.2161" y="1021.1249"/><text fill="#173D28" font-family="Arial" font-size="21.25" font-weight="bold" lengthAdjust="spacing" textLength="219.5833" x="160.9245" y="1058.7655">4. Eating and payment</text><text fill="#173D28" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="309.8958" x="160.9245" y="1083.2009">endTurn(): processEating() then</text><text fill="#173D28" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="387.8125" x="160.9245" y="1107.6364">processPayment() (Cashier, oldest first)</text><rect fill="#E4F4E9" height="108.7229" rx="8.8542" ry="8.8542" style="stroke:#3F9360;stroke-width:0.8854166666666666;" width="387.8125" x="160.9245" y="1165.2645"/><text fill="#173D28" font-family="Arial" font-size="21.25" font-weight="bold" lengthAdjust="spacing" textLength="285.1042" x="178.6328" y="1202.9051">5. Waiting and abandonment</text><text fill="#173D28" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="352.3958" x="178.6328" y="1227.3405">Waiting customers lose satisfaction;</text><text fill="#173D28" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="279.7917" x="178.6328" y="1251.776">at 0 they leave without paying</text><rect fill="#E4F4E9" height="59.8521" rx="8.8542" ry="8.8542" style="stroke:#3F9360;stroke-width:0.8854166666666666;" width="490.5208" x="109.5703" y="1309.4041"/><text fill="#173D28" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="455.1042" x="127.2786" y="1347.0447">Happy Hour countdown (Restaurant.endTurn())</text><polygon fill="#FFFFFF" points="273.3724,1404.6729,436.2891,1404.6729,457.5391,1425.9229,436.2891,1447.1729,273.3724,1447.1729,252.1224,1425.9229,273.3724,1404.6729" style="stroke:#5B6577;stroke-width:0.8854166666666666;"/><text fill="#173D28" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="162.9167" x="273.3724" y="1433.6374">turn 18 finished?</text><text fill="#4A5160" font-family="Arial" font-size="17.7083" lengthAdjust="spacing" textLength="21.25" x="230.8724" y="1422.1703">no</text><text fill="#4A5160" font-family="Arial" font-size="17.7083" lengthAdjust="spacing" textLength="26.5625" x="457.5391" y="1422.1703">yes</text><rect fill="#E4F4E9" height="59.8521" rx="8.8542" ry="8.8542" style="stroke:#3F9360;stroke-width:0.8854166666666666;" width="116.875" x="148.9714" y="1464.8812"/><text fill="#173D28" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="81.4583" x="166.6797" y="1502.5218">next turn</text><rect fill="#E4F4E9" height="84.2875" rx="8.8542" ry="8.8542" style="stroke:#3F9360;stroke-width:0.8854166666666666;" width="401.9792" x="301.263" y="1464.8812"/><text fill="#173D28" font-family="Arial" font-size="21.25" font-weight="bold" lengthAdjust="spacing" textLength="86.7708" x="318.9714" y="1502.5218">6. Result</text><text fill="#173D28" font-family="Arial" font-size="21.25" lengthAdjust="spacing" textLength="366.5625" x="318.9714" y="1526.9572">ResultEvaluator: VICTORY or DEFEAT</text><ellipse cx="502.2526" cy="1604.0646" fill="none" rx="19.4792" ry="19.4792" style="stroke:#222222;stroke-width:1.7708333333333333;"/><ellipse cx="502.2526" cy="1604.0646" fill="#222222" rx="10.625" ry="10.625" style="stroke:#222222;stroke-width:1.7708333333333333;"/><line style="stroke:#5B6577;stroke-width:1.9479166666666667;" x1="354.8307" x2="354.8307" y1="129.0019" y2="164.4186"/><polygon fill="#5B6577" points="347.7474,146.7103,354.8307,164.4186,361.9141,146.7103,354.8307,153.7936" style="stroke:#5B6577;stroke-width:1.7708333333333333;"/><line style="stroke:#5B6577;stroke-width:1.9479166666666667;" x1="354.8307" x2="354.8307" y1="351.0582" y2="393.5582"/><polygon fill="#5B6577" points="347.7474,375.8499,354.8307,393.5582,361.9141,375.8499,354.8307,382.9332" style="stroke:#5B6577;stroke-width:1.7708333333333333;"/><line style="stroke:#5B6577;stroke-width:1.9479166666666667;" x1="469.9349" x2="593.0078" y1="329.8082" y2="329.8082"/><polygon fill="#5B6577" points="585.9245,405.7759,593.0078,423.4842,600.0911,405.7759,593.0078,412.8592" style="stroke:#5B6577;stroke-width:1.9479166666666667;"/><line style="stroke:#5B6577;stroke-width:1.9479166666666667;" x1="593.0078" x2="593.0078" y1="329.8082" y2="510.077"/><line style="stroke:#5B6577;stroke-width:1.9479166666666667;" x1="593.0078" x2="376.0807" y1="510.077" y2="510.077"/><polygon fill="#5B6577" points="393.7891,502.9936,376.0807,510.077,393.7891,517.1603,386.7057,510.077" style="stroke:#5B6577;stroke-width:1.7708333333333333;"/><line style="stroke:#5B6577;stroke-width:1.9479166666666667;" x1="354.8307" x2="354.8307" y1="453.4103" y2="488.827"/><polygon fill="#5B6577" points="347.7474,471.1186,354.8307,488.827,361.9141,471.1186,354.8307,478.202" style="stroke:#5B6577;stroke-width:1.7708333333333333;"/><line style="stroke:#5B6577;stroke-width:1.9479166666666667;" x1="354.8307" x2="354.8307" y1="273.1415" y2="308.5582"/><polygon fill="#5B6577" points="347.7474,290.8499,354.8307,308.5582,361.9141,290.8499,354.8307,297.9332" style="stroke:#5B6577;stroke-width:1.7708333333333333;"/><line style="stroke:#5B6577;stroke-width:1.94791666